name: dxf-analyze
description: DXF 파일 상세 분석 (도면 기본 정보, 레이어, 좌표)

# 사용법: /dxf-analyze 가시설_평면.dxf

trigger:
  pattern: "dxf-analyze"
  input: "DXF 파일 경로"

output:
  format: "Markdown 분석 리포트"
  sections:
    - "📊 기본 정보"
    - "📍 좌표 범위"
    - "🔷 도형 분포"
    - "📝 레이어 분석"
    - "✍️ 텍스트 분석"

execution:
  command: |
    node -e "
      const parse = require('./src/core/parse.mjs');
      const fs = require('fs');
      const file = process.argv[1];
      const dwg = parse.readDwg(file);
      console.log('# DXF 분석: ' + file);
      console.log('...');
    "
  timeout: "2m"

features:
  - "엔티티 타입별 개수 (LINE, CIRCLE, TEXT 등)"
  - "좌표 범위 (min/max X, Y, Z)"
  - "레이어별 도형 분포"
  - "텍스트 높이별 분류"
  - "도면 단위 감지"

