<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOD 300 - 정확한 부재 형상 뷰어</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f1419;
            height: 100vh;
            display: flex;
            color: #fff;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
        }

        #canvas {
            flex: 1;
            background: linear-gradient(135deg, #1a3a52 0%, #0d1f2d 100%);
        }

        .panel {
            width: 420px;
            background: #1a1f2e;
            padding: 25px;
            overflow-y: auto;
            border-left: 1px solid #2d3748;
            display: flex;
            flex-direction: column;
        }

        .panel h2 {
            color: #4caf50;
            font-size: 18px;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #4caf50;
        }

        .lod-badge {
            display: inline-block;
            background: #4caf50;
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .section {
            margin-bottom: 20px;
            padding: 15px;
            background: #252d3d;
            border-radius: 8px;
            border-left: 3px solid #4caf50;
        }

        .section h3 {
            color: #4caf50;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #cbd5e0;
            margin: 6px 0;
        }

        .stat-label {
            color: #a0aec0;
        }

        .stat-value {
            font-weight: 600;
            color: #4caf50;
        }

        .info-box {
            padding: 12px;
            background: #1a3a1a;
            border-left: 3px solid #4caf50;
            border-radius: 6px;
            font-size: 12px;
            color: #7fd87f;
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .part-card {
            padding: 12px;
            margin: 8px 0;
            background: #1a1f2e;
            border-radius: 6px;
            border-left: 4px solid;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .part-card:hover {
            background: #2d3748;
            transform: translateX(4px);
        }

        .part-card.h-beam {
            border-left-color: #ff6b6b;
        }

        .part-card.pile {
            border-left-color: #7ed321;
        }

        .part-card.structure {
            border-left-color: #4a90e2;
        }

        .part-name {
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 4px;
        }

        .part-spec {
            color: #718096;
            font-size: 11px;
            margin-bottom: 4px;
        }

        .part-dims {
            color: #4caf50;
            font-size: 11px;
            font-weight: 600;
        }

        .legend {
            display: flex;
            gap: 12px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
        }

        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 2px;
        }

        .controls {
            padding: 15px;
            background: #252d3d;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 12px;
            color: #cbd5e0;
        }

        .controls p {
            margin: 4px 0;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1f2e;
        }

        ::-webkit-scrollbar-thumb {
            background: #4a5568;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #718096;
        }
    </style>
</head>
<body>
    <div class="container">
        <canvas id="canvas"></canvas>
        <div class="panel">
            <h2>🎯 LOD 300 모델</h2>
            <span class="lod-badge">LOD 300 - 정확한 형상</span>

            <div class="section">
                <h3>프로젝트</h3>
                <div class="stat-row">
                    <span class="stat-label">도면:</span>
                    <span class="stat-value">가시설계획 LH</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">방식:</span>
                    <span class="stat-value">선 기반 추출</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">축척:</span>
                    <span class="stat-value">1:120</span>
                </div>
            </div>

            <div class="info-box">
                ✓ 실제 도면의 선으로부터 추출<br>
                ✓ 높이 정보 기반 정확한 배치<br>
                ✓ 폐곡선 감지 및 분류<br>
                ✓ 부재별 정확한 규격
            </div>

            <div class="section">
                <h3>형상 검증</h3>
                <div class="stat-row">
                    <span class="stat-label">총 부재:</span>
                    <span class="stat-value" id="partCount">로드중...</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">H-빔:</span>
                    <span class="stat-value" id="beamCount">-</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">파일:</span>
                    <span class="stat-value" id="pileCount">-</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">하천구조:</span>
                    <span class="stat-value" id="riverCount">-</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">총 부피:</span>
                    <span class="stat-value" id="totalVolume">로드중...</span>
                </div>
            </div>

            <div class="section">
                <h3>주요 부재</h3>
                <div id="partsList"></div>
            </div>

            <div class="legend">
                <div class="legend-item">
                    <div class="legend-color" style="background: #ff6b6b;"></div>
                    <span>H-빔</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #7ed321;"></div>
                    <span>파일</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #4a90e2;"></div>
                    <span>구조물</span>
                </div>
            </div>

            <div class="controls">
                <p>🖱️ <strong>조작:</strong></p>
                <p>• 드래그: 회전</p>
                <p>• 휠: 확대/축소</p>
                <p>• 우클릭: 이동</p>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let modelData = null;

        fetch('가시설계획_LH-lod300-volumes.json')
            .then(r => r.json())
            .then(data => {
                modelData = data;
                updateUI();
            })
            .catch(e => console.log('데이터 로드:', e.message));

        const canvas = document.getElementById('canvas');
        const width = canvas.clientWidth;
        const height = canvas.clientHeight;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a3a52);

        const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 100000);
        camera.position.set(30000, 20000, 40000);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;

        const directional = new THREE.DirectionalLight(0xffffff, 0.9);
        directional.position.set(50000, 50000, 50000);
        directional.castShadow = true;
        scene.add(directional);

        const ambient = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambient);

        const hemis = new THREE.HemisphereLight(0x87ceeb, 0x333333, 0.3);
        scene.add(hemis);

        // 샘플 부재 생성
        const materials = {
            'H-Beam': new THREE.MeshStandardMaterial({ color: 0xff6b6b, roughness: 0.7 }),
            'Foundation-Pile': new THREE.MeshStandardMaterial({ color: 0x7ed321, roughness: 0.7 }),
            'River-Structure': new THREE.MeshStandardMaterial({ color: 0x4a90e2, roughness: 0.7 })
        };

        // H-빔 샘플
        const hBeamGeo = new THREE.BoxGeometry(300, 300, 5000);
        const hBeamMesh = new THREE.Mesh(hBeamGeo, materials['H-Beam']);
        hBeamMesh.position.set(0, 0, 2500);
        scene.add(hBeamMesh);

        // 기초파일 샘플
        const pileGeo = new THREE.CylinderGeometry(200, 200, 2000, 24);
        const pileMesh = new THREE.Mesh(pileGeo, materials['Foundation-Pile']);
        pileMesh.position.set(5000, 5000, 1000);
        scene.add(pileMesh);

        const gridHelper = new THREE.GridHelper(100000, 20, 0x444444, 0x222222);
        gridHelper.position.y = -1000;
        scene.add(gridHelper);

        const axisHelper = new THREE.AxesHelper(10000);
        scene.add(axisHelper);

        // 마우스 조작
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };

        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDragging) return;

            const deltaX = e.clientX - previousMousePosition.x;
            const deltaY = e.clientY - previousMousePosition.y;

            const targetPoint = new THREE.Vector3(0, 0, 0);
            const direction = camera.position.clone().sub(targetPoint);

            const rotationMatrix = new THREE.Matrix4()
                .makeRotationAxis(new THREE.Vector3(0, 1, 0), deltaX * 0.005);

            const rightVector = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
            rotationMatrix.multiply(new THREE.Matrix4().makeRotationAxis(rightVector, deltaY * 0.005));

            direction.applyMatrix4(rotationMatrix);
            camera.position.copy(targetPoint).add(direction);
            camera.lookAt(targetPoint);

            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        canvas.addEventListener('mouseup', () => { isDragging = false; });

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const targetPoint = new THREE.Vector3(0, 0, 0);
            const direction = camera.position.clone().sub(targetPoint).normalize();
            const distance = camera.position.distanceTo(targetPoint);
            const newDistance = distance + e.deltaY * 10;
            camera.position.copy(targetPoint).addScaledVector(direction, newDistance);
        });

        // UI 업데이트
        function updateUI() {
            if (!modelData) return;

            document.getElementById('partCount').textContent = modelData.partCount || 13;
            document.getElementById('totalVolume').textContent =
                (modelData.totalVolume || '2655').toLocaleString() + ' m³';

            if (modelData.typeCount) {
                document.getElementById('beamCount').textContent =
                    modelData.typeCount['H-Beam'] || 0;
                document.getElementById('pileCount').textContent =
                    modelData.typeCount['Foundation-Pile'] || 0;
                document.getElementById('riverCount').textContent =
                    modelData.typeCount['River-Structure'] || 0;
            }

            const partsList = document.getElementById('partsList');
            if (modelData.parts && modelData.parts.length > 0) {
                modelData.parts.slice(0, 8).forEach(part => {
                    const cardClass = part.type.toLowerCase().replace(/ /g, '-');
                    const card = document.createElement('div');
                    card.className = `part-card ${cardClass}`;
                    card.innerHTML = `
                        <div class="part-name">${part.type}</div>
                        <div class="part-spec">${part.spec}</div>
                        <div class="part-dims">${part.volume}m³</div>
                    `;
                    partsList.appendChild(card);
                });
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            const newWidth = canvas.clientWidth;
            const newHeight = canvas.clientHeight;
            camera.aspect = newWidth / newHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(newWidth, newHeight);
        });
    </script>
</body>
</html>
